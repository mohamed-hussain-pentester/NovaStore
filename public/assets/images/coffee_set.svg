<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ef"/>
      <stop offset="100%" stop-color="#f5ebe0"/>
    </linearGradient>
    <linearGradient id="ceramic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="coffeeGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg_cf)"/>
  <!-- Shadow -->
  <ellipse cx="300" cy="385" rx="140" ry="20" fill="#d6cebd" opacity="0.6"/>
  <!-- Glass Carafe -->
  <path d="M 240,240 L 360,240 L 380,360 C 380,375 220,375 220,360 Z" fill="url(#coffeeGlass)" stroke="#94a3b8" stroke-width="2"/>
  <!-- Fresh Brewed Coffee Liquid in Carafe -->
  <path d="M 235,300 L 365,300 L 375,355 C 375,370 225,370 225,355 Z" fill="#78350f" opacity="0.9"/>
  <!-- Carafe handle -->
  <path d="M 370,255 C 410,265 410,335 375,345" stroke="#94a3b8" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Ceramic Dripper Cone sitting on top of carafe -->
  <polygon points="210,135 390,135 320,245 280,245" fill="url(#ceramic)" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Dripper top rim -->
  <ellipse cx="300" cy="135" rx="90" ry="16" fill="#e2e8f0"/>
  <ellipse cx="300" cy="135" rx="82" ry="12" fill="#78350f" opacity="0.4"/>
  <!-- Dripper wooden collar/base -->
  <rect x="260" y="235" width="80" height="12" rx="4" fill="#b45309"/>
</svg>
