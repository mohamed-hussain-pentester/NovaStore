<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="mouseBody" x1="0.3" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="metalWheel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg_m)"/>
  <!-- Shadow -->
  <ellipse cx="305" cy="355" rx="140" ry="26" fill="#94a3b8" opacity="0.45"/>
  <!-- Mouse Body (Ergonomic curve 57-degree tilt) -->
  <path d="M 210,310 C 190,260 210,180 280,140 C 350,100 410,160 410,240 C 410,310 340,335 270,335 C 240,335 220,325 210,310 Z" fill="url(#mouseBody)"/>
  <!-- Thumb rest flare -->
  <path d="M 210,310 C 180,315 160,285 185,250 C 205,220 220,240 220,280 Z" fill="#1e293b"/>
  <!-- Subtle grip texture on thumb rest -->
  <line x1="180" y1="260" x2="200" y2="280" stroke="#334155" stroke-width="2"/>
  <line x1="185" y1="270" x2="205" y2="290" stroke="#334155" stroke-width="2"/>
  <!-- Aluminum Scroll Wheel -->
  <rect x="295" y="145" width="22" height="50" rx="10" fill="url(#metalWheel)"/>
  <line x1="298" y1="160" x2="314" y2="160" stroke="#475569" stroke-width="2"/>
  <line x1="298" y1="170" x2="314" y2="170" stroke="#475569" stroke-width="2"/>
  <line x1="298" y1="180" x2="314" y2="180" stroke="#475569" stroke-width="2"/>
  <!-- Split line for left/right click -->
  <path d="M 306,195 L 306,230" stroke="#0f172a" stroke-width="2"/>
  <!-- Gesture button -->
  <rect x="225" y="225" width="16" height="24" rx="4" fill="#334155"/>
  <!-- Status light -->
  <circle cx="306" cy="250" r="3" fill="#38bdf8"/>
</svg>
