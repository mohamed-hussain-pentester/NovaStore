<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Shadow -->
  <ellipse cx="300" cy="360" rx="220" ry="24" fill="#cbd5e1" opacity="0.6"/>
  <!-- Monitor Stand Base / Shelf -->
  <rect x="100" y="270" width="400" height="28" rx="8" fill="url(#wood)"/>
  <rect x="100" y="270" width="400" height="6" rx="3" fill="#fde68a" opacity="0.4"/>
  <!-- Metal Legs -->
  <rect x="140" y="298" width="36" height="52" rx="4" fill="url(#metal)"/>
  <rect x="424" y="298" width="36" height="52" rx="4" fill="url(#metal)"/>
  <!-- Curved Screen Silhouette on top of stand -->
  <path d="M 120,240 Q 300,225 480,240 L 480,120 Q 300,105 120,120 Z" fill="#0f172a" opacity="0.9"/>
  <path d="M 125,235 Q 300,221 475,235 L 475,125 Q 300,111 125,125 Z" fill="#1e293b"/>
  <!-- Ambient screen glow -->
  <path d="M 160,200 Q 300,185 440,200 L 440,145 Q 300,132 160,145 Z" fill="#38bdf8" opacity="0.25"/>
  <!-- Monitor Stand Pedestal Base -->
  <rect x="270" y="240" width="60" height="30" rx="4" fill="url(#metal)"/>
</svg>
