<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_eb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pebbleCase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg_eb)"/>
  <!-- Shadow -->
  <ellipse cx="300" cy="365" rx="130" ry="24" fill="#94a3b8" opacity="0.45"/>
  <!-- Charging Case Opened Base -->
  <rect x="200" y="220" width="200" height="120" rx="40" fill="url(#pebbleCase)"/>
  <!-- Open Lid folded back -->
  <path d="M 210,225 C 210,140 390,140 390,225 Z" fill="#1e293b" opacity="0.85"/>
  <!-- Earbud Left -->
  <g transform="translate(245, 230)">
    <circle cx="0" cy="0" r="22" fill="#475569"/>
    <path d="M 0,10 L 0,40" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="14" fill="#0f172a"/>
    <line x1="-3" y1="40" x2="3" y2="40" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <!-- Earbud Right -->
  <g transform="translate(355, 230)">
    <circle cx="0" cy="0" r="22" fill="#475569"/>
    <path d="M 0,10 L 0,40" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="14" fill="#0f172a"/>
    <line x1="-3" y1="40" x2="3" y2="40" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <!-- LED battery indicator on front of case -->
  <circle cx="300" cy="305" r="3" fill="#38bdf8"/>
</svg>
