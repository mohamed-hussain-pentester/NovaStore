<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="anodized" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg_cs)"/>
  <!-- Shadow -->
  <ellipse cx="300" cy="380" rx="140" ry="20" fill="#94a3b8" opacity="0.4"/>
  <!-- Base -->
  <rect x="200" y="340" width="200" height="30" rx="15" fill="url(#anodized)"/>
  <!-- Earbud charging pad on base -->
  <ellipse cx="260" cy="355" rx="30" ry="6" fill="#334155"/>
  <!-- Metal angled upright arm -->
  <path d="M 330,345 L 370,190 L 350,190 L 315,345 Z" fill="#64748b"/>
  <!-- MagSafe disc angled for phone -->
  <circle cx="270" cy="190" r="50" fill="url(#anodized)"/>
  <circle cx="270" cy="190" r="42" fill="#334155"/>
  <circle cx="270" cy="190" r="30" fill="none" stroke="#64748b" stroke-dasharray="4,4" stroke-width="2"/>
  <!-- Arm connector to phone disc -->
  <rect x="300" y="185" width="40" height="10" rx="4" fill="#64748b"/>
  <!-- Watch charging puck on right branch -->
  <path d="M 360,240 Q 400,230 420,210" stroke="#64748b" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="425" cy="205" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
</svg>
